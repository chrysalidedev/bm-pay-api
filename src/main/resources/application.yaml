ktor:
  application:
    modules:
      - com.buildmain.ApplicationKt.module
  deployment:
    port: 8080
    host: 0.0.0.0

jeko:
  baseUrl: ${JEKO_API_BASE_URL:-"https://api.jeko.africa"}

database:
  url: ${DB_JDBC_URL:-"jdbc:sqlite:build_main.db"}
  driver: ${DB_DRIVER:-"org.sqlite.JDBC"}
  user: ${DB_USER:-""}
  password: ${DB_PASSWORD:-""}
